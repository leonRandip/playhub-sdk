# coturn, TURN REST API mode: the hub hands players short-lived credentials signed with the
# shared secret (passed on the command line from TURN_SECRET). Runs with network_mode: host.
listening-port=3478
min-port=49160
max-port=49200
fingerprint
use-auth-secret
realm=playhub
no-cli
no-multicast-peers
# Never relay into private networks (stops TURN being used to probe your network or the server itself).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Keep one user from hogging the free bandwidth.
user-quota=12
total-quota=200
bps-capacity=0
stale-nonce=600
log-file=stdout
simple-log
